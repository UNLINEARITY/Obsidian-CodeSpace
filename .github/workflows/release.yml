name: Release

# 推送纯 SemVer tag（如 2.5.1）自动发布：
# - 标题 = 版本号；说明优先取 docs/releases/<tag>.md（缺失回退自动生成）
# - 已存在同名 release 时跳过发布（防重推 tag / 重复运行导致重复发布）

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run lint
          npm test

      - name: Build release artifacts
        run: npm run build

      - name: Verify release version
        shell: bash
        run: |
          manifest_version="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")"
          if [ "$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version" >&2
            exit 1
          fi

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "${GITHUB_REPOSITORY}"; then
            echo "::notice::Release $GITHUB_REF_NAME already exists, skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest release artifacts
        if: steps.check.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
              --title "$GITHUB_REF_NAME" --notes-file "$NOTES" --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
