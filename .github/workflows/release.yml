name: Release

# 手动触发：输入与 manifest.json 版本一致的 tag（如 2.5.0）。
# tag 需已推送（--verify-tag 会校验存在性）；不再由 tag 推送自动触发。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match manifest.json version)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run lint
          npm test

      - name: Build release artifacts
        run: npm run build

      - name: Verify release version
        shell: bash
        run: |
          manifest_version="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")"
          if [ "$manifest_version" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match manifest version $manifest_version" >&2
            exit 1
          fi

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" main.js manifest.json styles.css --title "Code Space $RELEASE_TAG" --generate-notes --verify-tag
